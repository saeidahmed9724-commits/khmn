<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#070D1E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Glowing outer card (rotated) -->
  <g transform="translate(256 256) rotate(-8) translate(-140 -200)">
    <rect width="280" height="400" rx="36" fill="#1b2150" stroke="#38BDF8" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- Main Card -->
  <g transform="translate(256 256) rotate(6) translate(-140 -200)">
    <rect width="280" height="400" rx="36" fill="url(#cardGrad)" stroke="#FBBF24" stroke-width="6" filter="url(#glow)"/>
    <rect x="20" y="20" width="240" height="360" rx="26" fill="#0F172A" fill-opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Question mark / secret icon -->
    <text x="140" y="235" font-family="'Cairo', sans-serif, system-ui" font-weight="900" font-size="160" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">?</text>
    
    <!-- Decorative star sparkles -->
    <circle cx="60" cy="70" r="8" fill="#FDE047"/>
    <circle cx="220" cy="330" r="6" fill="#38BDF8"/>
    <circle cx="220" cy="80" r="10" fill="#F43F5E"/>
    <circle cx="65" cy="325" r="7" fill="#A855F7"/>
  </g>
</svg>
